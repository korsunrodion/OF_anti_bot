[project]
name = "skill-fastai-research"
version = "0.1.0"
description = "Bot-risk classifier — fastai tabular + LightGBM ensemble"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.6,<5",
    "torch>=2.4,<3",
    "fastai>=2.8,<3",
    "peewee>=3.17,<5",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
]

[tool.uv]
# CPU-only torch wheels (inference must run on CPU; training also CPU-safe).
# Comment this section out if you want CUDA wheels for training.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
